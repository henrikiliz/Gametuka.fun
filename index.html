<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GameTuka.fun</title>

<style>

body{
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
font-family:Arial;
text-align:center;
margin:0;
}

h1{
font-size:50px;
margin-top:30px;
color:#00ff88;
text-shadow:0 0 15px #00ff88;
}

p{
opacity:0.8;
}

.menu{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:25px;
margin-top:40px;
}

.jogo{
width:200px;
height:180px;
background:#111;
border-radius:20px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
font-size:22px;
cursor:pointer;
transition:0.3s;
box-shadow:0 0 15px rgba(0,0,0,0.5);
}

.jogo:hover{
transform:scale(1.1);
background:#00ff88;
color:black;
box-shadow:0 0 25px #00ff88;
}

.emoji{
font-size:40px;
margin-bottom:10px;
}

</style>
</head>

<body>

<h1>🎮 GameTuka.fun</h1>
<p>Escolha seu jogo</p>

<div class="menu">

<div class="jogo" onclick="location.href='circuito.html'">
<div class="emoji">⚡</div>
Circuit Tuka
</div>

<div class="jogo" onclick="location.href='wordpuzzle.html'">
<div class="emoji">🧩</div>
Word Puzzle
</div>

<!-- NOVO JOGO AQUI -->
<div class="jogo" onclick="location.href='jogos/tukaluck/index.html'">
<div class="emoji">🎰</div>
Tuka Luck
</div>

</div>

</body>
</html>
