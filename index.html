<!DOCTYPE html>
<html>
<head>

<title>GameTuka.fun</title>

<style>

body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
}

h1{
font-size:45px;
color:#00ff55;
}


.menu{

display:grid;
grid-template-columns:repeat(auto-fit,220px);
gap:20px;
justify-content:center;

}


.jogo{

height:180px;
background:#222;
border-radius:20px;

display:flex;
align-items:center;
justify-content:center;

font-size:25px;

cursor:pointer;

transition:.3s;

}


.jogo:hover{

transform:scale(1.08);
background:#00aa44;

}


</style>

</head>


<body>


<h1>🎮 GameTuka.fun</h1>

<p>Minigames criados por você</p>


<div class="menu">


<div class="jogo"
onclick="location.href='jogos/circuito/index.html'">

⚡<br>
Circuit Tuka

</div>



<div class="jogo"
onclick="location.href='jogos/wordpuzzle/index.html'">

🧩<br>
Word Puzzle

</div>


</div>


</body>
</html>
