<!DOCTYPE html>
<html>
<head>
    <title>GameTuka</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            text-align: center;
        }

        h1 {
            margin-top: 50px;
            font-size: 40px;
        }

        .container {
            margin-top: 50px;
        }

        .game-btn {
            display: block;
            width: 250px;
            margin: 20px auto;
            padding: 20px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background: #00c6ff;
            color: black;
            cursor: pointer;
            transition: 0.3s;
        }

        .game-btn:hover {
            background: #0072ff;
            color: white;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <h1>🎮 GameTuka</h1>

    <div class="container">
        <button class="game-btn" onclick="location.href='circuito.html'">
            🏎️ Circuito
        </button>

        <button class="game-btn" onclick="location.href='wordpuzzle.html'">
            🧩 Word Puzzle
        </button>
    </div>

</body>
</html>
